<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d12" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>SCUDERIA MOZARELLA — F1-менеджер 2026</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Офлайн: після першого відкриття гра живе без мережі (PWA).
      // На localhost воркер не реєструємо — інакше E2E-прогони й дев-сервер
      // отримували б закешовану стару збірку.
      if (
        'serviceWorker' in navigator &&
        location.protocol.startsWith('http') &&
        !['localhost', '127.0.0.1'].includes(location.hostname)
      ) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
