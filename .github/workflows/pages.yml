# Автодеплой на GitHub Pages: кожен пуш у main збирає гру (вигаданий грид,
# PWA, SEO) і кладе dist у гілку gh-pages — GitHub роздає її на
# https://everyway123.github.io/scuderia-mozarella/
#
# Деплой через гілку, а не через actions/deploy-pages: створення Pages-сайту
# через API вимагає прав, яких немає в GITHUB_TOKEN, а пуш gh-pages
# автоматично вмикає і оновлює сайт без жодних налаштувань.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Публічна збірка йде з вигаданим гридом: реальні назви команд і імена
      # пілотів — чужі торгові марки, їм не місце на публічному хостингу
      - run: npm run build
        env:
          VITE_GRID: fictional
      - run: touch dist/.nojekyll
      - name: Push dist to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
